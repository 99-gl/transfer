[project]
name = "eda-knowledge-graph-workbench"
version = "0.1.0"
description = "Single-graph Excel import and query workbench for EDA knowledge graphs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "graphiti-core==0.29.2",
    "neo4j>=5.26.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
