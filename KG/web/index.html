<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EDA 知识图谱工作台</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">EDA KNOWLEDGE GRAPH</p>
        <h1>知识图谱工作台</h1>
      </div>
      <div class="topbar-actions">
        <span id="connection-state" class="status">Neo4j</span>
        <button id="clear-graph-button" class="danger-button" type="button">清空图谱</button>
      </div>
    </header>

    <main>
      <section class="workspace-grid" aria-label="数据导入与查询">
        <section class="panel" aria-labelledby="import-title">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">DATA SYNC</p>
              <h2 id="import-title">导入数据</h2>
            </div>
          </div>
          <form id="import-form" class="form-stack">
            <label for="import-type">数据格式</label>
            <select id="import-type" name="import_type">
              <option value="excel">Excel</option>
              <option value="json">JSON</option>
            </select>
            <label class="file-field" for="data-file">
              <span>数据文件</span>
              <input id="data-file" name="file" type="file" accept=".xlsx,.xlsm" required />
            </label>
            <div id="sheet-field">
              <label for="sheet-name">工作表名称</label>
              <input id="sheet-name" name="sheet" type="text" placeholder="默认活动工作表" />
            </div>
            <div class="actions">
              <button id="preview-button" type="submit">预览变更</button>
              <button id="commit-button" type="button" disabled>确认同步</button>
            </div>
          </form>
          <div id="import-result" class="result-area" aria-live="polite"></div>
        </section>

        <section class="panel" aria-labelledby="search-title">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">GRAPH QUERY</p>
              <h2 id="search-title">查询节点</h2>
            </div>
          </div>
          <form id="search-form" class="search-row">
            <select id="search-mode" aria-label="查询模式">
              <option value="keyword">关键词</option>
              <option value="semantic">语义</option>
              <option value="hybrid">混合</option>
            </select>
            <input id="search-query" type="search" placeholder="节点名称、序号、现象或识别方法" required />
            <button type="submit">查询</button>
          </form>
          <div id="search-result" class="result-area" aria-live="polite"></div>
        </section>
      </section>

      <section class="panel detail-panel" aria-labelledby="detail-title">
        <div class="panel-heading">
          <div>
            <p class="section-kicker">NODE DETAIL</p>
            <h2 id="detail-title">节点详情</h2>
          </div>
        </div>
        <div id="node-detail" class="empty-state">从查询结果中选择一个节点。</div>
      </section>
    </main>
    <script src="/assets/app.js"></script>
  </body>
</html>
