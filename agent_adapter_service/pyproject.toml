[project]
name = "agent-adapter-service"
version = "0.1.0"
description = "OpenAI and Anthropic protocol adapter for SGLang with per-trajectory JSONL capture"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "anthropic>=0.40",
    "httpx[http2]>=0.27",
    "jinja2>=3.1",
    "openai>=1.50",
    "pydantic>=2.7",
    "safetensors>=0.4",
    "sglang",
    "tokenizers>=0.20",
    "torch>=2.5",
    "transformers>=4.45",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false
